<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    SmartPath | Saved Reservations
  </title>


  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >


  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  >


  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <main class="admin-page">


    <div class="admin-top">


      <div>

        <img
          src="smartpath-logo.png"
          alt="SmartPath Logo"
          class="admin-logo"
        >


        <p class="small-title">
          SMARTPATH ADMIN
        </p>


        <h1>
          Saved Reservations
        </h1>


        <p>
          Reservations made on this browser will appear here.
        </p>

      </div>


      <a
        href="index.html"
        class="back-link"
      >
        ← Back to Website
      </a>


    </div>



    <div class="admin-buttons">


      <button
        class="print-button"
        onclick="window.print()"
      >
        Print Reservations
      </button>


      <button
        class="clear-button"
        onclick="clearReservations()"
      >
        Clear All
      </button>


    </div>



    <div
      id="reservationList"
      class="reservation-list"
    >
    </div>


  </main>


  <script src="reservations.js"></script>


</body>

</html>
